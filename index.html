<!-- ═════ APP STORE + APPLE ARCADE ADD-ON ═════
     Paste this whole block just before </body> (after apple-layer.css is loaded).
     It inserts a "Today" page, an Arcade game shelf, a Top Free chart and a bottom tab bar. -->
<style>
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
:root{--sf:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Helvetica Neue",system-ui,sans-serif;--sp:cubic-bezier(.34,1.56,.64,1)}
#appstore{max-width:1200px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(14px,3vw,24px);font-family:var(--sf);position:relative;z-index:1}
.as-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.as-date{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3,#94a3b8)}
.as-title{font-size:clamp(40px,7.5vw,60px);font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--text,#fff)}
.as-av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:linear-gradient(#17172b,#17172b) padding-box,conic-gradient(#FF375F,#FF9F0A,#FFD60A,#30D158,#64D2FF,#0A84FF,#BF5AF2,#FF375F) border-box;border:3px solid transparent}
.as-h2{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 12px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.as-h2 b{font-size:clamp(22px,3.2vw,28px);font-weight:800;letter-spacing:-.03em;color:var(--text,#fff)}
.as-h2 a{font-size:15px;font-weight:600;color:#0A84FF}
/* squircle app icon */
.as-ic{flex:none;width:var(--s,60px);height:var(--s,60px);border-radius:22.37%;display:grid;place-items:center;font-size:calc(var(--s,60px)*.52);
  background:linear-gradient(145deg,var(--a),var(--b));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(0,0,0,.25),0 8px 18px -6px var(--b)}
/* featured Today card */
.as-feat{position:relative;overflow:hidden;border-radius:32px;min-height:clamp(360px,54vw,500px);padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;justify-content:space-between;color:#fff;
  background:radial-gradient(70% 60% at 85% 10%,#FF375F,transparent 60%),radial-gradient(60% 60% at 10% 90%,#0A84FF,transparent 60%),radial-gradient(50% 50% at 60% 100%,#BF5AF2,transparent 65%),#241a4a;
  box-shadow:0 40px 80px -30px rgba(94,92,230,.8),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .6s var(--sp)}
.as-feat:hover{transform:scale(1.015)}
.as-feat::before{content:'🎮';position:absolute;right:-2%;top:6%;font-size:clamp(180px,32vw,340px);opacity:.95;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5));transform:rotate(-12deg);animation:fl 7s ease-in-out infinite alternate}
@keyframes fl{to{transform:rotate(-4deg) translateY(-16px)}}
.as-eye{position:relative;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.as-big{position:relative;font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin-top:6px;max-width:11em;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.as-bar{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:22px;background:rgba(20,20,40,.38);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border:1px solid rgba(255,255,255,.2)}
.as-bar div{flex:1;min-width:0}.as-bar b{display:block;font-size:16px}.as-bar small{opacity:.75;font-size:13px}
/* GET button with download ring */
.as-get{position:relative;border:none;cursor:pointer;padding:7px 22px;border-radius:999px;font:800 15px var(--sf);color:#0A84FF;background:rgba(120,130,170,.28);transition:transform .3s var(--sp);min-width:72px;min-height:32px}
.as-get:hover{transform:scale(1.08)}.as-get:active{transform:scale(.92)}
.as-get.load{font-size:0;min-width:0;width:32px;padding:0;background:conic-gradient(#0A84FF var(--p),rgba(255,255,255,.22) 0);animation:fill 1.5s linear forwards}
.as-get.load::after{content:'';position:absolute;inset:3px;border-radius:50%;background:#1b1b33}
@keyframes fill{to{--p:100%}}
/* arcade shelf */
.as-row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 24px;scrollbar-width:none}.as-row::-webkit-scrollbar{display:none}
.as-game{flex:0 0 clamp(250px,30vw,320px);scroll-snap-align:start;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 22px 44px -18px rgba(0,0,0,.6);backdrop-filter:blur(26px);transition:transform .5s var(--sp)}
.as-game:hover{transform:translateY(-8px) scale(1.025)}
.as-art{position:relative;height:190px;display:grid;place-items:center;font-size:92px;overflow:hidden;background:radial-gradient(80% 90% at 20% 0%,var(--a),transparent 70%),radial-gradient(80% 90% at 90% 100%,var(--b),transparent 70%),#1a1a30}
.as-art span{filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));transition:transform .6s var(--sp)}.as-game:hover .as-art span{transform:scale(1.18) rotate(-8deg)}
.as-art i{position:absolute;top:12px;left:12px;font:800 10px var(--sf);letter-spacing:.12em;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.35);color:#fff;backdrop-filter:blur(10px)}
.as-info{display:flex;align-items:center;gap:12px;padding:14px}.as-info div{flex:1;min-width:0}
.as-info b,.as-li b{display:block;font-size:16px;font-weight:700;color:var(--text,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-info small,.as-li small{font-size:13px;color:var(--text3,#94a3b8)}
/* top free chart */
.as-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));column-gap:28px}
.as-li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}.as-li div{flex:1;min-width:0}
.as-li em{font:800 18px var(--sf);font-style:normal;width:22px;text-align:center;color:var(--text,#fff)}
/* bottom tab bar */
.as-dock{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9500;display:flex;gap:2px;padding:7px;border-radius:999px;
  background:rgba(25,25,50,.55);backdrop-filter:blur(34px) saturate(1.9);-webkit-backdrop-filter:blur(34px) saturate(1.9);border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.as-dock a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 14px;border-radius:999px;font:700 10px var(--sf);color:#e8e8ff;transition:all .3s var(--sp)}
.as-dock a span{font-size:19px}.as-dock a:hover{background:rgba(255,255,255,.16);transform:scale(1.1)}
#backTop{bottom:96px !important}footer{padding-bottom:110px !important}
@media(max-width:480px){.as-dock a{padding:7px 9px}}
</style>
<script>
(function(){
  const G=[ // [name, genre, emoji, colour A, colour B]
   ["Sneaky Sasquatch","Open-world comedy","🏕️","#30D158","#0A84FF"],
   ["Hello Kitty Island Adventure","Cosy adventure","🎀","#FF6482","#BF5AF2"],
   ["Fruit Ninja Classic+","Arcade action","🍉","#FF9F0A","#FF375F"],
   ["Cut the Rope Remastered","Physics puzzle","🍬","#64D2FF","#30D158"],
   ["Sonic Dream Team","3D platformer","💨","#0A84FF","#5E5CE6"],
   ["Skate City: New York","Sports","🛹","#FFD60A","#FF9F0A"],
   ["Dead Cells+","Roguelite","☠️","#BF5AF2","#FF375F"],
   ["Angry Birds Reloaded","Puzzle action","🐦","#FF375F","#FFD60A"]];
  const T=[["Subway Surfers","Arcade","🏃","#FFD60A","#0A84FF"],["Candy Crush Saga","Puzzle","🍭","#FF6482","#BF5AF2"],
   ["Clash Royale","Strategy","👑","#0A84FF","#5E5CE6"],["Among Us","Party","🧑‍🚀","#FF375F","#FF9F0A"],
   ["Roblox","Adventure","🧱","#64D2FF","#0A84FF"],["Pokémon GO","Adventure","🔴","#30D158","#64D2FF"]];
  const ic=(g,s)=>`<div class="as-ic" style="--a:${g[3]};--b:${g[4]};--s:${s}px">${g[2]}</div>`;
  const get='<button class="as-get">GET</button>';
  const d=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
  const s=document.createElement('section');s.id='appstore';
  s.innerHTML=`
   <div class="as-head"><div><div class="as-date">${d}</div><div class="as-title">Today</div></div><div class="as-av">☁️</div></div>
   <div class="as-feat"><div><div class="as-eye">Apple Arcade · Featured</div><div class="as-big">Play without limits.</div></div>
     <div class="as-bar">${ic(G[2],54)}<div><b>${G[2][0]}</b><small>${G[2][1]} · Arcade</small></div>${get}</div></div>
   <div class="as-h2" id="arcade"><b>Apple Arcade Picks</b><a href="https://www.apple.com/apple-arcade/" target="_blank">See All</a></div>
   <div class="as-row">${G.map(g=>`<div class="as-game"><div class="as-art" style="--a:${g[3]};--b:${g[4]}"><i>ARCADE</i><span>${g[2]}</span></div>
     <div class="as-info">${ic(g,48)}<div><b>${g[0]}</b><small>${g[1]}</small></div>${get}</div></div>`).join('')}</div>
   <div class="as-h2" id="topfree"><b>Top Free Games</b><a href="https://apps.apple.com/in/charts/iphone/games/6014" target="_blank">See All</a></div>
   <div class="as-list">${T.map((g,i)=>`<div class="as-li"><em>${i+1}</em>${ic(g,58)}<div><b>${g[0]}</b><small>${g[1]}</small></div>${get}</div>`).join('')}</div>`;
  document.querySelector('.hero').after(s);
  const dock=document.createElement('nav');dock.className='as-dock';
  dock.innerHTML='<a href="#appstore"><span>📱</span>Today</a><a href="#arcade"><span>🕹️</span>Arcade</a><a href="#topfree"><span>🏆</span>Charts</a><a href="#news"><span>📰</span>News</a><a href="#markets"><span>📈</span>Markets</a>';
  document.body.appendChild(dock);
  document.addEventListener('click',e=>{const b=e.target.closest('.as-get');if(!b||b.dataset.s)return;b.dataset.s=1;b.classList.add('load');
    setTimeout(()=>{b.classList.remove('load');b.style.animation='none';b.textContent='OPEN'},1600)});
})();
</script>
